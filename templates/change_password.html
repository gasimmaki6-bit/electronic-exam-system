{% extends "base.html" %}
{% block title %}{{ t('change_password_title') }}{% endblock %}
{% block content %}
<div class="card" style="max-width:450px;">
    <h2>{{ t('change_password_title') }}</h2>
    <form method="POST">
        <div class="form-group">
            <label>{{ t('current_password') }}</label>
            <input type="password" name="current_password" required>
        </div>
        <div class="form-group">
            <label>{{ t('new_password') }}</label>
            <input type="password" name="new_password" required minlength="4">
        </div>
        <div class="form-group">
            <label>{{ t('confirm_new_password') }}</label>
            <input type="password" name="confirm_password" required minlength="4">
        </div>
        <button type="submit" class="btn btn-primary">{{ t('save') }}</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">{{ t('cancel') }}</a>
    </form>
</div>
{% endblock %}

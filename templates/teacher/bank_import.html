{% extends "base.html" %}
{% block title %}{{ t('csv_import_title') }}{% endblock %}
{% block content %}
<h1>{{ t('csv_import_title') }}</h1>

<div class="card" style="max-width:650px;">
    <p style="color:#64748b;">{{ t('csv_import_instructions') }}</p>
    <p style="color:#64748b; font-size:13px;">💡 {{ t('download_sample_hint') }}</p>

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>{{ t('choose_csv_file') }}</label>
            <input type="file" name="csv_file" accept=".csv" required>
        </div>
        <button type="submit" class="btn btn-primary">{{ t('import_btn') }}</button>
        <a href="{{ url_for('teacher_bank') }}" class="btn btn-secondary">{{ t('cancel') }}</a>
        <a href="{{ url_for('teacher_bank_export') }}" class="btn btn-secondary">{{ t('export_csv') }}</a>
    </form>
</div>
{% endblock %}
